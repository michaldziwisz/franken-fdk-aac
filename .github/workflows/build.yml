name: Build Franken FDK AAC (Windows x64 + x86)

# Two ways to run:
#  1. Manually (Actions tab -> "Run workflow") -> binaries as downloadable
#     artifacts (login required to download).
#  2. Push a version tag (e.g. v1.0.0) -> GitHub builds AND publishes a public
#     Release. Release assets are hosted and served by GitHub and can be
#     downloaded by ANYONE, no login required. It is GitHub, not the author,
#     that distributes the built binary; the user obtains it from GitHub.
#
# PATENT NOTICE: AAC is covered by patents (baseline/AAC-LC through 2028,
# HE-AAC/HE-AAC v2 extensions through 2031). By building/using the resulting
# encoder you are responsible for any patent licensing that may apply in your
# jurisdiction and use case. See README / NOTICE.fdk-aac.

"on":
  workflow_dispatch:
    inputs:
      arch:
        description: "Which binaries to build"
        required: true
        default: "both"
        type: choice
        options: [both, x64, x86]
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed for the release job to create a Release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host: x86_64-w64-mingw32
          - arch: x86
            host: i686-w64-mingw32
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Skip arch not requested
        id: gate
        run: |
          # On a tag push there is no input -> build everything.
          want='${{ github.event.inputs.arch }}'
          [ -z "$want" ] && want=both
          if [ "$want" != "both" ] && [ "$want" != "${{ matrix.arch }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.arch }} (user chose $want)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mingw-w64 toolchain (+ wine for PGO training)
        if: steps.gate.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 autoconf automake libtool pkg-config make wine
          # x86 training needs the 32-bit wine; if unavailable, the build
          # step detects it and falls back to -O3 -flto without PGO.
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y wine32 || true

      - name: Build libfdk-aac (static) + frontend for ${{ matrix.arch }} (-O3 -flto + PGO)
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -euo pipefail
          HOST='${{ matrix.host }}'
          GAR="$HOST-gcc-ar"
          GRANLIB="$HOST-gcc-ranlib"
          ROOT="$PWD"
          BUILD="$HOME/build-${{ matrix.arch }}"
          PREFIX="$BUILD/inst"
          BASE="-O3 -DNDEBUG -flto"
          GEN="$BASE -fprofile-generate"
          rm -rf "$BUILD"; mkdir -p "$BUILD"
          # Fresh trees per arch (avoids cross-arch leftovers).
          cp -r "$ROOT/src-fdk-aac" "$BUILD/fdk-aac"
          cp -r "$ROOT/src-fdkaac"  "$BUILD/fdkaac"

          # --- phase 1: instrumented build (-fprofile-generate) ---
          cd "$BUILD/fdk-aac"
          # Makefile.am carries the added franken.cpp, so regenerate the build system.
          autoreconf -fi
          ./configure --host="$HOST" --prefix="$PREFIX" \
            --enable-static --disable-shared AR="$GAR" RANLIB="$GRANLIB" \
            CFLAGS="$GEN" CXXFLAGS="$GEN"
          make -j"$(nproc)"
          make install

          cd "$BUILD/fdkaac"
          autoreconf -fi || ./bootstrap || true
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --host="$HOST" CFLAGS="$GEN -I$PREFIX/include" \
            LDFLAGS="-static -static-libgcc -flto -O3 -fprofile-generate -L$PREFIX/lib"
          make -j"$(nproc)"

          # --- phase 2: PGO training under wine ---
          # Deterministic synthetic stereo 48 kHz (noise + tones); the profiles
          # only need realistic branch statistics, not real music.
          PGO=1
          if ! (
            mkdir -p "$HOME/pgo-train"
            python3 - "$HOME/pgo-train" <<'PYEOF'
          import sys, wave, struct, math, random
          t = sys.argv[1]
          random.seed(20261103)
          for fn, secs in [('dance.wav', 30), ('ld.wav', 30), ('long.wav', 120)]:
              o = wave.open(t + '/' + fn, 'wb'); o.setnchannels(2); o.setsampwidth(2); o.setframerate(48000)
              for i in range(secs * 48000):
                  env = 0.5 + 0.5 * math.sin(2 * math.pi * 0.5 * i / 48000)
                  l = int(12000 * env * math.sin(2 * math.pi * (220 + 880 * (i % 48000) / 48000) * i / 48000))
                  r = int(10000 * (2 * random.random() - 1))
                  o.writeframes(struct.pack('<hh', l, r))
              o.close()
          PYEOF
            export WINEDEBUG=-all
            T="$HOME/pgo-train"; E="$BUILD/fdkaac/fdkaac.exe"
            wine "$E" -S -f 2 -b 128000      -o "$T/t1.aac" "$T/dance.wav" &&
            wine "$E" -S -f 2 -p 5 -b 48000  -o "$T/t2.aac" "$T/dance.wav" &&
            wine "$E" -S -f 2 -p 29 -b 32000 -o "$T/t3.aac" "$T/dance.wav" &&
            wine "$E" -S -f 2 -b 64000       -o "$T/t4.aac" "$T/ld.wav" &&
            wine "$E" -S -f 2 -b 128000      -o "$T/t6.aac" "$T/long.wav" &&
            wine "$E" -S -f 2 --resample 44100 -b 96000 -o "$T/t7.aac" "$T/dance.wav" &&
            wine "$E" -S --dab -b 96         -o "$T/t8.dab" "$T/dance.wav"
          ) >"$HOME/pgo-train.log" 2>&1; then
            echo "wine PGO training failed; falling back to -O3 -flto without PGO"
            PGO=0
          fi
          GCDA=$(find "$BUILD" -name '*.gcda' | wc -l)
          echo "gcda collected: $GCDA (PGO=$PGO)"

          # --- phase 3: final build with the collected profiles ---
          USE="$BASE"
          if [ "$PGO" = 1 ] && [ "$GCDA" -gt 0 ]; then
            USE="$BASE -fprofile-use -fprofile-correction"
          else
            PGO=0
          fi

          cd "$BUILD/fdk-aac"
          make clean
          make -j"$(nproc)" CFLAGS="$USE" CXXFLAGS="$USE"
          make install

          cd "$BUILD/fdkaac"
          make clean
          make -j"$(nproc)" CFLAGS="$USE -I$PREFIX/include" \
            LDFLAGS="-static -static-libgcc -flto -O3 $([ "$PGO" = 1 ] && echo '-fprofile-use -fprofile-correction') -L$PREFIX/lib"
          echo "built with: $USE (PGO=$PGO)"

          mkdir -p "$ROOT/out"
          PKGDIR="$ROOT/out/franken-fdk-aac-${{ matrix.arch }}"
          mkdir -p "$PKGDIR"
          cp fdkaac.exe "$PKGDIR/fdkaac-franken-${{ matrix.arch }}.exe"
          "$HOST-strip" "$PKGDIR/fdkaac-franken-${{ matrix.arch }}.exe" || true
          # Bundle the documentation so the downloaded package is complete.
          for f in README.md README.html README.pdf \
                   MANUAL.en.md MANUAL.en.html MANUAL.en.pdf \
                   MANUAL.pl.md MANUAL.pl.html MANUAL.pl.pdf \
                   NOTICE.fdk-aac CHANGES.md; do
            [ -f "$ROOT/$f" ] && cp "$ROOT/$f" "$PKGDIR/" || true
          done
          ls -la "$PKGDIR"

      - name: Sanity check (--help runs under wine, non-fatal)
        if: steps.gate.outputs.skip == 'false'
        run: |
          sudo apt-get install -y wine || true
          wine "out/franken-fdk-aac-${{ matrix.arch }}/fdkaac-franken-${{ matrix.arch }}.exe" --help 2>/dev/null | head -5 || \
            echo "wine smoke check skipped/failed (non-fatal; binary is for Windows)"

      - name: Upload ${{ matrix.arch }} package (binary + docs)
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: franken-fdk-aac-${{ matrix.arch }}
          path: out/franken-fdk-aac-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90

  # Runs only for tag pushes: gathers the built packages and publishes a public
  # GitHub Release. Release assets are downloadable by anyone without a login.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each package
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          mkdir -p assets
          for d in dist/*/; do
            name="$(basename "$d")"        # e.g. franken-fdk-aac-x64
            (cd "$d" && zip -r "$OLDPWD/assets/${name}-${TAG}.zip" .)
          done
          ls -la assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Franken FDK AAC ${{ github.ref_name }}
          body: |
            Windows binaries of Franken FDK AAC, built by GitHub Actions.

            Each zip contains the encoder `.exe` plus the full documentation
            (README + manuals in EN/PL, NOTICE, CHANGES).

            PATENT NOTICE: AAC is patent-encumbered (AAC-LC through 2028,
            HE-AAC/HE-AAC v2 through 2031). By downloading and using these
            binaries you are responsible for any patent licensing that applies
            to you. These files are built and hosted by GitHub. See NOTICE.fdk-aac.
          files: assets/*.zip
          fail_on_unmatched_files: true
          # Tags like v1.4.0-beta.1 are published as pre-releases (not "latest").
          prerelease: ${{ contains(github.ref_name, '-') }}
